<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizer v4 Post/Composite Smoke</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; min-height: 100%; background: #05070d; color: #d9f2ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    section { width: min(760px, 100%); border: 1px solid rgba(99, 210, 255, 0.35); border-radius: 18px; padding: 24px; background: linear-gradient(145deg, rgba(20,32,56,.88), rgba(4,8,16,.94)); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
    h1 { letter-spacing: .08em; margin: 0 0 12px; }
    canvas { width: 100%; height: 260px; display: block; border-radius: 14px; background: radial-gradient(circle at 50% 50%, #17365a, #03050a 70%); }
    #status { margin: 16px 0 8px; color: #86e7ff; }
    #errors, #telemetry { color: #8da4b7; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>VISUALIZER V4 POST/COMPOSITOR SMOKE</h1>
    <canvas id="v4-canvas" aria-label="v4 authored clear/draw smoke canvas"></canvas>
    <div id="status">Probing renderer…</div>
    <div id="telemetry"></div>
    <div id="errors"></div>
  </section>
</main>
<script type="module">
import { startV4Runtime } from './runtime.js';
import { RenderGraph, renderTarget, depthTarget, renderPass, postPass, compositePass } from './render-graph.js';

const smokeManifest = {
  schemaVersion: 1,
  id: 'runtime-clear-draw-smoke',
  title: 'Runtime Clear/Draw Smoke',
  assets: [],
  pipelines: [
    { id: 'v4-clear-draw-pipeline', kind: 'render', entryPoint: 'main' },
    { id: 'v4-post-tonemap-pipeline', kind: 'post', entryPoint: 'fs' },
    { id: 'v4-composite-pipeline', kind: 'render', entryPoint: 'fs' },
  ],
  simulationBuffers: [],
  controls: [],
  transitions: [],
};

function makeSmokeGraph() {
  return new RenderGraph({ id: 'runtime-clear-draw-smoke' })
    .addResource(renderTarget('smoke-color'))
    .addResource(renderTarget('post-color'))
    .addResource(depthTarget('smoke-depth'))
    .addPass(renderPass('draw-smoke-triangle', {
      pipeline: 'v4-clear-draw-pipeline',
      colorTargets: ['smoke-color'],
      depthTarget: 'smoke-depth',
      draw: [3, 1, 0, 0],
      clearColor: { r: 0.01, g: 0.015, b: 0.035, a: 1 },
    }))
    .addPass(postPass('post-tonemap-glow', {
      pipeline: 'v4-post-tonemap-pipeline',
      inputs: ['smoke-color'],
      output: 'post-color',
      clearColor: { r: 0.004, g: 0.006, b: 0.012, a: 1 },
    }))
    .addPass(compositePass('composite-to-swapchain', {
      layers: ['post-color'],
      output: 'swapchain',
      pipeline: 'v4-composite-pipeline',
      draw: [3, 1, 0, 0],
      clearColor: { r: 0.005, g: 0.008, b: 0.015, a: 1 },
    }));
}

function makePipelines({ device, format }) {
  const sceneShader = device.createShaderModule({ label: 'v4-demo-authored-triangle-wgsl', code: `
struct VertexOut { @builtin(position) position: vec4f, @location(0) color: vec3f };
@vertex fn vs(@builtin(vertex_index) vertexIndex: u32) -> VertexOut {
  var positions = array<vec2f, 3>(vec2f(-0.82, -0.72), vec2f(0.82, -0.68), vec2f(0.02, 0.78));
  var colors = array<vec3f, 3>(vec3f(0.08, 0.86, 1.0), vec3f(1.0, 0.16, 0.72), vec3f(0.96, 0.95, 0.24));
  var out: VertexOut;
  out.position = vec4f(positions[vertexIndex], 0.0, 1.0);
  out.color = colors[vertexIndex];
  return out;
}
@fragment fn fs(in: VertexOut) -> @location(0) vec4f {
  return vec4f(in.color, 1.0);
}` });
  const fullscreenShader = device.createShaderModule({ label: 'v4-demo-post-composite-wgsl', code: `
struct FullscreenOut { @builtin(position) position: vec4f, @location(0) uv: vec2f };
@group(0) @binding(0) var sourceSampler: sampler;
@group(0) @binding(1) var sourceTexture: texture_2d<f32>;

@vertex fn vs(@builtin(vertex_index) vertexIndex: u32) -> FullscreenOut {
  var positions = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(3.0, 1.0), vec2f(-1.0, 1.0));
  var out: FullscreenOut;
  let p = positions[vertexIndex];
  out.position = vec4f(p, 0.0, 1.0);
  out.uv = p * vec2f(0.5, -0.5) + vec2f(0.5, 0.5);
  return out;
}

fn boundedToneMap(color: vec3f) -> vec3f {
  let bounded = clamp(color, vec3f(0.0), vec3f(4.0));
  return bounded / (vec3f(1.0) + bounded);
}

@fragment fn postFs(in: FullscreenOut) -> @location(0) vec4f {
  let base = textureSample(sourceTexture, sourceSampler, in.uv).rgb;
  let center = vec2f(0.5, 0.5);
  let dist = distance(in.uv, center);
  let glowMask = 1.0 - smoothstep(0.10, 0.72, dist);
  let restrainedGlow = vec3f(0.08, 0.22, 0.34) * glowMask + base * glowMask * 0.18;
  let mapped = boundedToneMap(base * 1.18 + restrainedGlow);
  return vec4f(clamp(mapped, vec3f(0.0), vec3f(0.92)), 1.0);
}

@fragment fn compositeFs(in: FullscreenOut) -> @location(0) vec4f {
  let color = textureSample(sourceTexture, sourceSampler, in.uv).rgb;
  return vec4f(clamp(color, vec3f(0.0), vec3f(1.0)), 1.0);
}` });
  const fullscreenLayout = device.createBindGroupLayout({
    label: 'v4-demo-fullscreen-texture-layout',
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float', viewDimension: '2d' } },
    ],
  });
  const fullscreenPipelineLayout = device.createPipelineLayout({ label: 'v4-demo-fullscreen-pipeline-layout', bindGroupLayouts: [fullscreenLayout] });
  const sceneBase = { layout: 'auto', vertex: { module: sceneShader, entryPoint: 'vs' }, fragment: { module: sceneShader, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'triangle-list' } };
  const fullscreenBase = { layout: fullscreenPipelineLayout, vertex: { module: fullscreenShader, entryPoint: 'vs' }, fragment: { module: fullscreenShader, targets: [{ format }] }, primitive: { topology: 'triangle-list' } };
  return new Map([
    ['v4-clear-draw-pipeline', device.createRenderPipeline({ ...sceneBase, depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' } })],
    ['v4-post-tonemap-pipeline', device.createRenderPipeline({ ...fullscreenBase, fragment: { ...fullscreenBase.fragment, entryPoint: 'postFs' } })],
    ['v4-composite-pipeline', device.createRenderPipeline({ ...fullscreenBase, fragment: { ...fullscreenBase.fragment, entryPoint: 'compositeFs' } })],
  ]);
}

const canvas = document.getElementById('v4-canvas');
const statusElement = document.getElementById('status');
const telemetryElement = document.getElementById('telemetry');
const errorsElement = document.getElementById('errors');

try {
  const runtime = await startV4Runtime({ canvas, statusElement, manifest: smokeManifest, graphFactory: makeSmokeGraph, pipelineRegistryFactory: makePipelines });
  let resourceTelemetry = null;
  if (runtime.resourceManager) {
    const bufferUsage = globalThis.GPUBufferUsage ? (GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST) : 0x80 | 0x8;
    const textureUsage = globalThis.GPUTextureUsage ? (GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST) : 0x04 | 0x02;
    runtime.resourceManager.createBuffer('smoke-telemetry-particles', { size: 32768, usage: bufferUsage, label: 'runtime-smoke:telemetry-particles' });
    runtime.resourceManager.createTexture('smoke-telemetry-lut', { size: [16, 16, 1], format: 'rgba8unorm', usage: textureUsage, label: 'runtime-smoke:telemetry-lut' });
    resourceTelemetry = runtime.resourceManager.telemetry();
    telemetryElement.textContent = `Known manager allocation: ${resourceTelemetry.knownAllocatedBytes} bytes; external browser/driver GPU usage: unknown. No live GPU telemetry is displayed.`;
  } else {
    telemetryElement.textContent = 'WebGPU resource manager inactive; no GPU resources allocated on fallback route. No live GPU telemetry is displayed.';
  }
  errorsElement.textContent = runtime.publicErrors.map((error) => `${error.code}: ${error.message}`).join('\n');
  window.__V4_RUNTIME_SMOKE__ = { label: 'authored triangle through real offscreen post stack and swapchain compositor; not Cathedral or full bloom parity', mode: runtime.mode, graphId: runtime.graph?.id, passes: runtime.graph?.passes.map((pass) => pass.id), passKinds: runtime.graph?.passes.map((pass) => pass.kind), resources: runtime.graph?.resources.map((resource) => resource.id), postStatus: 'bounded tone map plus restrained center glow, no history/trails', resourcesReady: statusElement.dataset.resourcesReady, frameSubmitted: statusElement.dataset.frameSubmitted, telemetry: resourceTelemetry };
  const ctx = runtime.graphExecutor ? null : canvas.getContext('2d');
  if (ctx) {
    canvas.width = Math.max(1, canvas.clientWidth || 960); canvas.height = Math.max(1, canvas.clientHeight || 360);
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#10284e'); gradient.addColorStop(0.5, runtime.mode === 'webgl2-legacy' ? '#4d2d72' : '#166e83'); gradient.addColorStop(1, '#05070d');
    ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#d9f2ff'; ctx.font = '28px monospace'; ctx.fillText(runtime.modeLabel, 34, 72);
    ctx.font = '16px monospace'; ctx.fillText('Fallback: post/composite WebGPU path inactive. No live GPU telemetry is displayed.', 34, 112);
  }
} catch (error) {
  statusElement.textContent = 'Runtime initialization failed safely';
  errorsElement.textContent = 'manifest-validation: Runtime smoke manifest failed validation.';
}
</script>
</body>
</html>
