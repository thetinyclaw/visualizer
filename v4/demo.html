<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizer v4 Runtime Smoke</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #05070d; color: #d9f2ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    section { width: min(760px, 100%); border: 1px solid rgba(99, 210, 255, 0.35); border-radius: 18px; padding: 24px; background: linear-gradient(145deg, rgba(20,32,56,.88), rgba(4,8,16,.94)); box-shadow: 0 28px 90px rgba(0,0,0,.45); }
    h1 { letter-spacing: .08em; margin: 0 0 12px; }
    canvas { width: 100%; height: 260px; display: block; border-radius: 14px; background: radial-gradient(circle at 50% 50%, #17365a, #03050a 70%); }
    #status { margin: 16px 0 8px; color: #86e7ff; }
    #errors { color: #8da4b7; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>VISUALIZER V4 RUNTIME</h1>
    <canvas id="v4-canvas" width="960" height="360" aria-label="v4 runtime smoke canvas"></canvas>
    <div id="status">Probing renderer…</div>
    <div id="errors"></div>
  </section>
</main>
<script type="module">
import { startV4Runtime } from './runtime.js';

const smokeManifest = {
  schemaVersion: 1,
  id: 'runtime-smoke',
  title: 'Runtime Smoke',
  assets: [{ id: 'blue-noise', type: 'texture', uri: 'generated://blue-noise' }],
  pipelines: [
    { id: 'scene-simulate', kind: 'compute', entryPoint: 'main' },
    { id: 'scene-volume', kind: 'render', entryPoint: 'main' },
    { id: 'bloom-tonemap', kind: 'post', entryPoint: 'main' },
  ],
  simulationBuffers: [{ id: 'particles', kind: 'ping-pong', byteLength: 32768 }],
  controls: [{ id: 'density', type: 'float', min: 0, max: 1, default: 1 }],
  transitions: [{ id: 'crossfade', type: 'crossfade', durationMs: 900 }],
};

const canvas = document.getElementById('v4-canvas');
const statusElement = document.getElementById('status');
const errorsElement = document.getElementById('errors');

try {
  const runtime = await startV4Runtime({ canvas, statusElement, manifest: smokeManifest });
  errorsElement.textContent = runtime.publicErrors.map((error) => `${error.code}: ${error.message}`).join('\n');
  const ctx = canvas.getContext('2d');
  if (ctx) {
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    gradient.addColorStop(0, '#10284e');
    gradient.addColorStop(0.5, runtime.mode === 'webgl2-legacy' ? '#4d2d72' : '#166e83');
    gradient.addColorStop(1, '#05070d');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#d9f2ff';
    ctx.font = '28px monospace';
    ctx.fillText(runtime.modeLabel, 34, 72);
    ctx.font = '16px monospace';
    ctx.fillText('No live GPU telemetry is displayed on this smoke route.', 34, 112);
  }
} catch (error) {
  statusElement.textContent = 'Runtime initialization failed safely';
  errorsElement.textContent = 'manifest-validation: Runtime smoke manifest failed validation.';
}
</script>
</body>
</html>
