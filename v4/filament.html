<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizer v4 · Filament Vortex WebGPU</title>
  <link rel="icon" href="/visualizer-brand/favicon-32.png?v=prism-pulse-20260720" sizes="32x32" type="image/png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #010208; color: #dce7ff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #filament-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: radial-gradient(circle at 50% 48%, #071024, #010208 72%); }
    h1 { position: fixed; top: 14px; left: 16px; z-index: 2; margin: 0; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: rgba(235, 244, 255, .90); text-shadow: 0 0 20px rgba(165, 195, 255, .35); }
    .hud { position: fixed; left: 16px; right: 16px; bottom: 14px; z-index: 2; display: grid; gap: 6px; max-width: 980px; padding: 12px 14px; border: 1px solid rgba(168, 199, 255, .28); border-radius: 14px; background: rgba(2, 5, 16, .62); box-shadow: 0 0 32px rgba(100, 150, 255, .13); backdrop-filter: blur(12px); }
    #status { font-weight: 650; }
    #errors { white-space: pre-wrap; color: #ffb5d1; font-size: 12px; min-height: 1em; }
    a { color: #a9ccff; }
  </style>
</head>
<body>
  <canvas id="filament-canvas" aria-label="Filament Vortex native WebGPU compute and ribbon canvas"></canvas>
  <h1>Filament Vortex · WebGPU compute</h1>
  <section class="hud" aria-live="polite">
    <div id="status">Initializing deterministic Filament Vortex WebGPU compute graph…</div>
    <div>Query: <code id="query-text">loading…</code>. Fallback comparison: <a id="fallback-link" href="./lab/filament-vortex.html">old WebGL lab</a>.</div>
    <div id="errors"></div>
  </section>
  <script type="module" src="./filament-route.js"></script>
</body>
</html>
