<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Reef Stipple</title>
  <style>
    *{box-sizing:border-box;margin:0} body{overflow:hidden;background:#020817;font-family:Courier New,monospace;color:#def} canvas{display:block} #overlay{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#0b2444,#000 70%);cursor:pointer;z-index:2;text-align:center} #overlay.hidden{opacity:0;pointer-events:none;transition:.6s} h1{letter-spacing:.16em;font-size:clamp(2rem,7vw,5rem);color:#aef;text-shadow:0 0 20px #0ff} p,#info{color:#77d8ff;font-size:12px} #info{position:fixed;left:12px;bottom:10px;z-index:1}
  </style>
</head>
<body>
  <div id="overlay" role="button" tabindex="0" aria-label="Start glass reef stipple"><div><h1>GLASS REEF</h1><p>click / enter · caustic stipples, shimmer, glitter</p></div></div>
  <div id="info"></div><canvas id="canvas"></canvas>
  <script>window.STIPPLE_CONFIG={title:'Glass Reef Stipple',variant:1,colors:['#00d8ff','#315bff','#ffffff','#020817']};</script>
  <script src="stipple-family.js"></script>
</body>
</html>
