  <script>
    window.CANDIDATE = {

      reference: 'doc_f2e836acf4a0_20260718-2039-12.9391643.mp4',
      note: 'Original chromatic torus organism: ref grammar transformed from iridescent ring/fiber stock footage into a mycorrhizal iris with FFT-owned filaments, spores, caustic corona, and a breathing void.'
    };
  </script>
  <script src="candidate-runner.js"></script>
  <script>
    startCandidate(`
      vec3 spectralRamp(float a, float r, float energy) {
        vec3 cyan = vec3(0.02, 0.85, 1.35);
        vec3 violet = vec3(0.48, 0.10, 1.24);
        vec3 magenta = vec3(1.18, 0.16, 0.92);
        vec3 amber = vec3(1.45, 0.58, 0.16);
        vec3 emerald = vec3(0.06, 1.05, 0.62);
        float warm = smoothstep(-0.35, 0.58, cos(a - 0.55));
        float cool = smoothstep(-0.25, 0.72, cos(a + 2.22));
        vec3 c = mix(violet, cyan, cool);
        c = mix(c, amber, warm * smoothstep(0.22, 0.88, r));
        c = mix(c, emerald, smoothstep(0.64, 0.98, sin(a * 1.7 + energy * 1.2)) * 0.35);
        return c;
      }

      float spokeBundle(float angle, float radius, float t) {
        float total = 0.0;
        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          float count = 46.0 + fi * 19.0;
          float lane = fract((angle / 6.2831853) * count + sin(radius * (4.0 + fi) - t * (0.18 + fi * 0.035)) * 0.11 + seed * 0.0007 * (fi + 1.0));
          float band = fftBand(fi * 3.0 + floor(lane * 16.0));
          float thread = smoothstep(0.020 + band * 0.010, 0.0, abs(lane - 0.5));
          float radialWindow = smoothstep(0.22, 0.68, radius) * smoothstep(1.42, 0.82, radius);
          total += thread * radialWindow * (0.22 + band * 0.74) / (1.0 + fi * 0.45);
        }
        return total;
      }

      float sporeField(vec2 p, float angle, float radius, float t) {
        vec2 g = vec2(angle * 2.7 + seed * 0.003, log(max(radius, 0.04)) * 8.0 - t * 0.42);
        vec2 id = floor(g * vec2(9.0, 13.0));
        vec2 f = fract(g * vec2(9.0, 13.0)) - 0.5;
        float glow = 0.0;
        for (int y = -1; y <= 1; y++) {
          for (int x = -1; x <= 1; x++) {
            vec2 cell = id + vec2(float(x), float(y));
            vec2 h = hash22(cell + seed * 0.011);
            vec2 q = f - (vec2(float(x), float(y)) + h - 0.5);
            float owner = hash21(cell + 4.2);
            float b = fftBand(owner * 15.0);
            float d2 = dot(q, q);
            glow += smoothstep(0.032 + b * 0.045, 0.0, d2) * (0.15 + b * 0.95) * step(0.55, owner);
          }
        }
        return glow * smoothstep(0.46, 0.98, radius) * smoothstep(1.52, 0.88, radius);
      }

      vec3 effect(vec2 uv, float t) {
        vec2 p = uv;
        float aspect = resolution.x / resolution.y;
        p.x *= aspect;
        p *= rot(-0.34 + sin(seed * 0.001) * 0.13);
        p.x *= 0.92;
        float radius = length(p);
        float angle = atan(p.y, p.x);
        float bass = fftBand(1.0);
        float mids = (fftBand(5.0) + fftBand(7.0) + fftBand(9.0)) * 0.3333;
        float highs = (fftBand(12.0) + fftBand(14.0) + fftBand(15.0)) * 0.3333;
        float irisRadius = 0.57 + bass * 0.055 + 0.022 * sin(t * 0.39);
        float thickness = 0.155 + mids * 0.07;
        float dRing = abs(radius - irisRadius);
        float ring = smoothstep(thickness, 0.0, dRing);
        float darkVoid = smoothstep(irisRadius * 0.76 + bass * 0.035, irisRadius * 0.44, radius);
        float outerFade = smoothstep(1.58, 0.55, radius);

        float orbital = angle + t * 0.19 + 0.32 * sin(radius * 3.1 - t * 0.17);
        float rib = spokeBundle(orbital, radius, t);
        float hair = spokeBundle(orbital * 1.013 + 0.7, radius * 1.21, -t * 0.61) * 0.52;
        float caustic = smoothstep(0.075 + highs * 0.02, 0.0, dRing + 0.025 * sin(angle * 19.0 + t * 0.65));
        float innerFire = smoothstep(0.17 + bass * 0.05, 0.0, abs(radius - (irisRadius - thickness * 0.58))) * smoothstep(-0.2, 0.96, cos(angle - 0.38));
        float outerBlue = smoothstep(0.26, 0.0, abs(radius - (irisRadius + thickness * 0.70))) * smoothstep(-0.35, 0.95, cos(angle + 2.55));
        float spores = sporeField(p, orbital, radius, t) * (0.45 + highs);
        vec3 base = spectralRamp(angle + t * 0.08, radius, mids);
        vec3 color = vec3(0.0);
        color += base * ring * (0.24 + rib * 1.85 + hair * 0.92);
        color += vec3(1.55, 0.86, 0.42) * innerFire * (0.65 + bass * 1.8);
        color += vec3(0.10, 0.95, 1.55) * outerBlue * (0.42 + highs * 1.3);
        color += vec3(1.1, 0.55, 1.6) * caustic * (0.18 + mids * 1.1);
        color += mix(vec3(0.18, 0.9, 1.35), vec3(1.25, 0.22, 1.0), fract(angle * 2.0 + radius * 3.0)) * spores;

        float corona = smoothstep(0.86, 0.0, dRing) * smoothstep(0.18, 1.35, radius) * outerFade;
        color += base * corona * 0.20;
        vec2 neb = p * rot(t * 0.035);
        float backgroundVeil = (sin(neb.x * 4.4 + t * 0.13) * sin(neb.y * 3.3 - t * 0.17) * 0.5 + 0.5);
        color += vec3(0.015, 0.026, 0.060) + vec3(0.035, 0.02, 0.085) * backgroundVeil * outerFade;
        color *= 1.0 - darkVoid * 0.84;
        color *= smoothstep(1.78, 0.18, radius);
        color = color / (1.0 + color * 0.56);
        color = pow(color, vec3(0.78));
        float grain = hash21(gl_FragCoord.xy + seed + time * 37.0) - 0.5;
        return color + grain * 0.018;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;
        gl_FragColor = vec4(effect(uv, time), 1.0);
      }
    `);
