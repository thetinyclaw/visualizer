  <script>

  <script src="candidate-runner.js"></script>
  <script>
    startCandidate(`
      float invSmooth(float lo, float hi, float x) { return 1.0 - smoothstep(lo, hi, x); }

      vec3 spectralRamp(float a, float r, float energy) {
        vec3 cyan = vec3(0.02, 0.85, 1.35);
        vec3 violet = vec3(0.48, 0.10, 1.24);
        vec3 magenta = vec3(1.18, 0.16, 0.92);
        vec3 amber = vec3(1.45, 0.58, 0.16);
        vec3 emerald = vec3(0.06, 1.05, 0.62);
        float warm = smoothstep(-0.35, 0.58, cos(a - 0.55));
        float cool = smoothstep(-0.25, 0.72, cos(a + 2.22));
        vec3 c = mix(violet, cyan, cool);
        c = mix(c, amber, warm * smoothstep(0.22, 0.88, r));
        c = mix(c, emerald, smoothstep(0.64, 0.98, sin(a * 1.7 + energy * 1.2)) * 0.35);
        return c;
      }

      float mycelialThreads(float angle, float radius, float t) {
        float total = 0.0;
        for (int i = 0; i < 4; i++) {
          float fi = float(i);
          float count = 34.0 + fi * 23.0;
          float phase = angle / 6.2831853 * count + seed * 0.00073 * (fi + 1.0);
          phase += sin(radius * (5.2 + fi * 1.7) - t * (0.24 + fi * 0.04)) * (0.12 + 0.03 * fi);
          float band = fftBand(fi * 3.0 + floor(fract(phase) * 16.0));
          float lane = abs(fract(phase) - 0.5);
          float thread = invSmooth(0.0, 0.020 + band * 0.012, lane);
          float companion = invSmooth(0.0, 0.012 + band * 0.008, abs(fract(phase * 1.618 + fi * 0.27) - 0.5));
          float radialWindow = smoothstep(0.18, 0.50, radius) * invSmooth(1.03, 1.54, radius);
          total += (thread + companion * 0.46) * radialWindow * (0.24 + band * 0.76) / (1.0 + fi * 0.36);
        }
        return total;
      }

      float fastSpores(float angle, float radius, float t) {
        vec2 g = vec2(angle * 3.1 + seed * 0.003, log(max(radius, 0.05)) * 7.5 - t * 0.38);
        vec2 cell = floor(g * vec2(13.0, 17.0));
        vec2 f = fract(g * vec2(13.0, 17.0)) - 0.5;
        vec2 h = hash22(cell + seed * 0.011) - 0.5;
        float owner = hash21(cell + 4.2);
        float b = fftBand(owner * 15.0);
        float d = length(f - h * 0.68);
        float core = invSmooth(0.0, 0.055 + b * 0.048, d) * step(0.42, owner);
        float dust = invSmooth(0.0, 0.020 + b * 0.015, abs(fract((g.x + g.y) * 9.7 + owner * 4.1) - 0.5));
        return (core + dust * 0.25) * smoothstep(0.42, 0.82, radius) * invSmooth(1.00, 1.55, radius);
      }

      vec3 effect(vec2 uv, float t) {
        vec2 p = uv;
        float aspect = resolution.x / resolution.y;
        p.x *= aspect;
        p *= rot(-0.31 + sin(seed * 0.001) * 0.13);
        p.x *= 0.86;
        float radius = length(p);
        float angle = atan(p.y, p.x);
        float bass = fftBand(1.0);
        float mids = (fftBand(5.0) + fftBand(7.0) + fftBand(9.0)) * 0.3333;
        float highs = (fftBand(12.0) + fftBand(14.0) + fftBand(15.0)) * 0.3333;
        float irisRadius = 0.55 + bass * 0.060 + 0.022 * sin(t * 0.39);
        float thickness = 0.175 + mids * 0.075;
        float dRing = abs(radius - irisRadius);
        float ring = invSmooth(0.0, thickness, dRing);
        float innerMask = invSmooth(0.0, irisRadius * 0.60 + bass * 0.035, radius);
        float outerFade = invSmooth(1.26, 1.92, radius);

        float swirl = 0.34 * sin(radius * 3.0 - t * 0.17) + 0.12 * sin(radius * 9.0 + t * 0.31);
        float orbital = angle + t * 0.19 + swirl;
        float rib = mycelialThreads(orbital, radius, t);
        float hair = mycelialThreads(orbital * 1.013 + 0.7, radius * 1.16, -t * 0.61) * 0.46;
        float caustic = invSmooth(0.0, 0.065 + highs * 0.020, abs(dRing + 0.024 * sin(angle * 19.0 + t * 0.65)));
        float innerFire = invSmooth(0.0, 0.18 + bass * 0.050, abs(radius - (irisRadius - thickness * 0.58))) * smoothstep(-0.2, 0.96, cos(angle - 0.38));
        float outerBlue = invSmooth(0.0, 0.28, abs(radius - (irisRadius + thickness * 0.70))) * smoothstep(-0.35, 0.95, cos(angle + 2.55));
        float spores = fastSpores(orbital, radius, t) * (0.50 + highs);
        vec3 base = spectralRamp(angle + t * 0.08, radius, mids);
        vec3 color = vec3(0.0);
        color += base * ring * (0.34 + rib * 2.10 + hair * 1.05);
        color += vec3(1.55, 0.86, 0.42) * innerFire * (0.70 + bass * 1.65);
        color += vec3(0.10, 0.95, 1.55) * outerBlue * (0.48 + highs * 1.25);
        color += vec3(1.1, 0.55, 1.6) * caustic * (0.20 + mids * 1.15);
        color += mix(vec3(0.18, 0.9, 1.35), vec3(1.25, 0.22, 1.0), fract(angle * 2.0 + radius * 3.0)) * spores;

        float petal = invSmooth(0.0, 0.20 + 0.05 * mids, dRing) * (0.35 + 0.65 * sin(angle * 8.0 + radius * 6.0 - t * 0.42));
        color += base * max(petal, 0.0) * 0.22;
        float corona = invSmooth(0.0, 0.78, dRing) * smoothstep(0.18, 1.35, radius) * outerFade;
        color += base * corona * 0.22;
        vec2 neb = p * rot(t * 0.035);
        float backgroundVeil = (sin(neb.x * 4.4 + t * 0.13) * sin(neb.y * 3.3 - t * 0.17) * 0.5 + 0.5);
        color += vec3(0.018, 0.030, 0.070) + vec3(0.040, 0.022, 0.092) * backgroundVeil * outerFade;
        color *= 1.0 - innerMask * 0.78;
        color *= invSmooth(1.45, 2.08, radius);
        color = color / (1.0 + color * 0.58);
        color = pow(max(color, vec3(0.0)), vec3(0.76));
        float grain = hash21(gl_FragCoord.xy + seed + time * 37.0) - 0.5;
        return max(color + grain * 0.016, vec3(0.0));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;
        gl_FragColor = vec4(effect(uv, time), 1.0);
      }
    `);
