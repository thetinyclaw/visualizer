  <script>
    window.CANDIDATE = {
      name: 'Prismatic Rupture Cathedral',
      reference: 'doc_e54f7242eea9_20260718-2038-39.1716252.mp4',
      note: 'Original monochrome volumetric shard tunnel: ref grammar transformed from hard-edged fractured black/white stock footage into a seedable organic mirror-cathedral with FFT-owned seams, aperture slabs, and depth shards.'
    };
  </script>
  <script src="candidate-runner.js"></script>
  <script>
    startCandidate(`
      float fractureCell(vec2 p, float scale, float bandBase) {
        vec2 g = p * scale;
        vec2 id = floor(g);
        vec2 f = fract(g) - 0.5;
        float owner = hash21(id + seed * 0.017 + bandBase);
        float b = fftBand(bandBase + owner * 15.0);
        vec2 q = rot(owner * 6.2831853 + b * 0.42) * f;
        float bend = sin((q.x + q.y) * 7.0 + owner * 9.0 + time * 0.19) * (0.020 + b * 0.018);
        float a = abs(q.x + bend);
        float c = abs(q.y - bend * 0.7);
        float d = abs(q.x * 0.72 + q.y * 0.92 + sin(owner * 14.0) * 0.08);
        float e = abs(q.x * 1.15 - q.y * 0.48 + cos(owner * 11.0) * 0.05);
        float gate = smoothstep(0.08, 0.48, hash21(id + 3.1));
        return min(min(a, c), min(d, e + 0.05 * gate));
      }

      float shardSlab(vec2 p, float angle, float lane, float width) {
        vec2 q = rot(angle) * p;
        float stripe = abs(fract(q.x * lane + seed * 0.001) - 0.5);
        float panel = smoothstep(width, 0.0, stripe) * smoothstep(0.72, 0.06, abs(q.y));
        float clip = smoothstep(1.25, 0.18, length(p));
        return panel * clip;
      }

      vec3 effect(vec2 uv, float t) {
        vec2 p = uv;
        float aspect = resolution.x / resolution.y;
        p.x *= aspect;
        float bass = fftBand(1.0);
        float lowMid = fftBand(4.0);
        float high = fftBand(13.0);
        float orbit = t * 0.18 + seed * 0.00013;
        vec3 color = vec3(0.0);
        float occlusion = 1.0;

        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          float depth = fi / 4.0;
          float z = 0.38 + depth * 1.72;
          vec2 q = p * (1.0 + depth * 1.24);
          q *= rot(orbit * (0.55 + depth * 0.37) + fi * 0.61 + 0.11 * sin(t * 0.23 + fi));
          q.x += sin(t * 0.19 + fi * 1.73 + seed * 0.002) * 0.21 * depth;
          q.y += cos(t * 0.16 + fi * 1.11) * 0.13 * depth;

          float scale = 2.8 + fi * 1.35 + bass * 0.55;
          float crack = fractureCell(q, scale, fi * 2.7);
          float seamWidth = 0.022 + fftBand(fi * 2.0 + 2.0) * 0.045;
          float seam = smoothstep(seamWidth, 0.0, crack);
          float filament = smoothstep(seamWidth * 0.30, 0.0, crack);
          float ring = abs(length(q) - (0.30 + depth * 0.38 + 0.05 * sin(t * 0.7 + fi)));
          float tunnelRib = smoothstep(0.026 + high * 0.018, 0.0, ring);
          float radialGate = smoothstep(1.62, 0.04, length(q));
          float mirror = max(shardSlab(q, fi * 0.77 + orbit, 3.0 + fi * 0.8, 0.034 + lowMid * 0.018), shardSlab(q, -fi * 0.54 + orbit * 0.7, 2.2 + fi, 0.022 + high * 0.015));
          float aperture = smoothstep(0.82 + bass * 0.08, 0.18, max(abs(q.x * 0.42), abs(q.y * 1.65 + sin(fi + t * 0.4) * 0.12)));
          float layerLight = (seam * 0.72 + filament * 1.4 + tunnelRib * 0.55 + mirror * (1.4 + 1.5 * fftBand(fi + 8.0))) * radialGate;
          float flash = smoothstep(0.91, 0.22, abs(q.x + sin(t * 0.33 + fi) * 0.22)) * smoothstep(0.72, 0.0, abs(q.y)) * aperture;
          layerLight += flash * (0.16 + 1.85 * bass) * (1.0 - depth * 0.12);
          color += vec3(layerLight) * (0.29 + depth * 0.26) * occlusion;
          color += vec3(0.18, 0.21, 0.25) * seam * depth * 0.22;
          occlusion *= 0.78 + 0.12 * smoothstep(0.55, 1.45, length(q));
        }

        vec2 wide = p * vec2(aspect, 1.0);
        vec2 flankA = rot(0.74 + orbit * 0.55) * (wide + vec2(-0.78, 0.08));
        vec2 flankB = rot(-0.68 + orbit * 0.42) * (wide + vec2(0.72, -0.04));
        float wideCrackA = smoothstep(0.030 + high * 0.012, 0.0, fractureCell(flankA, 3.25 + bass, 6.0));
        float wideCrackB = smoothstep(0.026 + lowMid * 0.014, 0.0, fractureCell(flankB, 4.10 + high, 10.0));
        float sideShardA = shardSlab(flankA, 0.23, 5.2, 0.020 + high * 0.015);
        float sideShardB = shardSlab(flankB, -0.18, 4.6, 0.018 + lowMid * 0.014);
        float sideMask = smoothstep(2.15, 0.05, length(wide)) * (0.30 + 0.92 * smoothstep(0.25, 1.55, abs(wide.x)));
        float obliqueSheets = shardSlab(wide, 0.92 + orbit * 0.18, 3.6, 0.018 + high * 0.012) + shardSlab(wide, -0.82 + orbit * 0.15, 3.2, 0.018 + lowMid * 0.012);
        color += vec3(0.56, 0.60, 0.66) * (wideCrackA * 0.98 + wideCrackB * 0.86) * sideMask;
        color += vec3(0.88, 0.92, 0.98) * (sideShardA + sideShardB + obliqueSheets * 0.75) * sideMask * (0.34 + 0.96 * high);

        float apertureCore = smoothstep(0.095 + bass * 0.04, 0.0, abs(p.x * aspect)) * smoothstep(1.08, 0.0, abs(p.y));
        float cross = apertureCore + smoothstep(0.062 + high * 0.024, 0.0, abs(p.y)) * smoothstep(0.98, 0.0, abs(p.x * aspect));
        float vignette = smoothstep(1.95, 0.08, length(wide));
        color += vec3(cross) * (0.58 + bass * 1.55);
        color *= vignette;
        color += vec3(0.018, 0.022, 0.027) * (1.0 - vignette);
        color = color / (1.0 + color * 0.72);
        color = pow(color, vec3(0.72));
        float grain = hash21(gl_FragCoord.xy + time * 23.0 + seed) - 0.5;
        return color + grain * 0.028;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;
        gl_FragColor = vec4(effect(uv, time), 1.0);
      }
    `);
