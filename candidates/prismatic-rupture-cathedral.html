<body>
  <canvas id="canvas" aria-label="Prismatic Rupture Cathedral visualizer candidate"></canvas>
  <div id="label"></div>
  <div id="telemetry">demo FFT · add ?benchmark=1&seed=491009&frames=120 for telemetry</div>
  <script>
    window.CANDIDATE = {
      name: 'Prismatic Rupture Cathedral',
      reference: 'doc_e54f7242eea9_20260718-2038-39.1716252.mp4',
      note: 'Original monochrome volumetric shard tunnel: ref grammar transformed from hard-edged fractured black/white stock footage into a seedable organic mirror-cathedral with FFT-owned seams, aperture slabs, and depth shards.'
    };
  </script>
  <script src="candidate-runner.js"></script>
  <script>
    startCandidate(`
      float invSmooth(float lo, float hi, float x) { return 1.0 - smoothstep(lo, hi, x); }

      float fractureCell(vec2 p, float scale, float bandBase) {
        vec2 g = p * scale;
        vec2 id = floor(g);
        vec2 f = fract(g) - 0.5;
        float owner = hash21(id + seed * 0.017 + bandBase);
        float b = fftBand(bandBase + owner * 15.0);
        vec2 q = rot(owner * 6.2831853 + b * 0.42) * f;
        float bend = sin((q.x + q.y) * 7.0 + owner * 9.0 + time * 0.19) * (0.020 + b * 0.018);
        float a = abs(q.x + bend);
        float c = abs(q.y - bend * 0.7);
        float d = abs(q.x * 0.72 + q.y * 0.92 + sin(owner * 14.0) * 0.08);
        float e = abs(q.x * 1.15 - q.y * 0.48 + cos(owner * 11.0) * 0.05);
        float gate = smoothstep(0.08, 0.48, hash21(id + 3.1));
        return min(min(a, c), min(d, e + 0.05 * gate));
      }

      float shardSlab(vec2 p, float angle, float lane, float width) {
        vec2 q = rot(angle) * p;
        float stripe = abs(fract(q.x * lane + seed * 0.001) - 0.5);
        float panel = invSmooth(0.0, width, stripe) * invSmooth(0.06, 0.92, abs(q.y));
        float clip = invSmooth(0.18, 1.55, length(p));
        return panel * clip;
      }

      float archRib(vec2 p, float span, float lift, float band) {
        vec2 q = p;
        q.y += lift;
        float arch = abs(length(q * vec2(1.0 / span, 1.26)) - 0.82);
        float sideGate = smoothstep(0.05, 0.95, abs(p.x));
        return invSmooth(0.0, 0.022 + band * 0.024, arch) * sideGate * invSmooth(0.12, 1.82, length(p));
      }

      vec3 effect(vec2 uv, float t) {
        vec2 p = uv;
        float aspect = resolution.x / resolution.y;
        p.x *= aspect;
        float bass = fftBand(1.0);
        float lowMid = fftBand(4.0);
        float high = fftBand(13.0);
        float orbit = t * 0.18 + seed * 0.00013;
        vec3 color = vec3(0.0);
        float occlusion = 1.0;

        for (int i = 0; i < 5; i++) {
          float fi = float(i);
          float depth = fi / 4.0;
          vec2 q = p * (0.78 + depth * 1.00);
          q *= rot(orbit * (0.48 + depth * 0.34) + fi * 0.61 + 0.11 * sin(t * 0.23 + fi));
          q.x += sin(t * 0.19 + fi * 1.73 + seed * 0.002) * 0.24 * depth;
          q.y += cos(t * 0.16 + fi * 1.11) * 0.13 * depth;

          float scale = 2.2 + fi * 1.22 + bass * 0.45;
          float crack = fractureCell(q, scale, fi * 2.7);
          float seamWidth = 0.020 + fftBand(fi * 2.0 + 2.0) * 0.040;
          float seam = invSmooth(0.0, seamWidth, crack);
          float filament = invSmooth(0.0, seamWidth * 0.32, crack);
          float ring = abs(length(q * vec2(0.86, 1.05)) - (0.36 + depth * 0.42 + 0.05 * sin(t * 0.7 + fi)));
          float tunnelRib = invSmooth(0.0, 0.026 + high * 0.018, ring);
          float radialGate = invSmooth(1.42, 2.38, length(q));
          float mirror = max(shardSlab(q, fi * 0.77 + orbit, 2.6 + fi * 0.7, 0.034 + lowMid * 0.018), shardSlab(q, -fi * 0.54 + orbit * 0.7, 2.0 + fi, 0.022 + high * 0.015));
          float aperture = invSmooth(0.18, 0.98 + bass * 0.08, max(abs(q.x * 0.34), abs(q.y * 1.42 + sin(fi + t * 0.4) * 0.12)));
          float layerLight = (seam * 0.68 + filament * 1.18 + tunnelRib * 0.62 + mirror * (1.20 + 1.20 * fftBand(fi + 8.0))) * radialGate;
          float flash = invSmooth(0.22, 1.20, abs(q.x + sin(t * 0.33 + fi) * 0.22)) * invSmooth(0.0, 0.82, abs(q.y)) * aperture;
          layerLight += flash * (0.12 + 1.30 * bass) * (1.0 - depth * 0.12);
          color += vec3(layerLight) * (0.28 + depth * 0.25) * occlusion;
          color += vec3(0.18, 0.21, 0.25) * seam * depth * 0.24;
          occlusion *= 0.82 + 0.10 * smoothstep(0.55, 1.45, length(q));
        }

        vec2 flankA = rot(0.62 + orbit * 0.42) * (p + vec2(-0.72, 0.02));
        vec2 flankB = rot(-0.60 + orbit * 0.38) * (p + vec2(0.72, -0.02));
        float wideCrackA = invSmooth(0.0, 0.030 + high * 0.012, fractureCell(flankA, 3.10 + bass, 6.0));
        float wideCrackB = invSmooth(0.0, 0.028 + lowMid * 0.014, fractureCell(flankB, 3.75 + high, 10.0));
        float sideShardA = shardSlab(flankA, 0.23, 4.6, 0.020 + high * 0.015);
        float sideShardB = shardSlab(flankB, -0.18, 4.3, 0.018 + lowMid * 0.014);
        float sideMask = invSmooth(1.35, 2.45, length(p)) * (0.36 + 0.82 * smoothstep(0.18, 1.40, abs(p.x)));
        float obliqueSheets = shardSlab(p, 0.92 + orbit * 0.18, 3.2, 0.020 + high * 0.012) + shardSlab(p, -0.82 + orbit * 0.15, 3.0, 0.020 + lowMid * 0.012);
        float arch = archRib(p + vec2(0.0, 0.26), 1.28, 0.12, lowMid) + archRib(p + vec2(0.0, -0.16), 1.55, -0.08, high);
        color += vec3(0.52, 0.57, 0.64) * (wideCrackA * 0.95 + wideCrackB * 0.84) * sideMask;
        color += vec3(0.86, 0.91, 0.98) * (sideShardA + sideShardB + obliqueSheets * 0.78 + arch * 1.10) * sideMask * (0.36 + 0.90 * high);

        float apertureCore = invSmooth(0.0, 0.102 + bass * 0.04, abs(p.x)) * invSmooth(0.0, 1.10, abs(p.y));
        float cross = apertureCore + invSmooth(0.0, 0.065 + high * 0.024, abs(p.y)) * invSmooth(0.0, 1.42, abs(p.x));
        float veil = invSmooth(0.0, 0.030 + lowMid * 0.018, abs(sin((p.x * 1.7 + p.y * 0.6) * 9.0 + t * 0.24))) * invSmooth(1.05, 2.35, length(p));
        float vignette = invSmooth(1.60, 2.72, length(p));
        color += vec3(cross) * (0.46 + bass * 1.15);
        color += vec3(0.12, 0.14, 0.17) * veil * 0.55;
        color *= vignette;
        color += vec3(0.018, 0.022, 0.027) * (1.0 - vignette) + vec3(0.020, 0.024, 0.030);
        color = color / (1.0 + color * 0.72);
        color = pow(max(color, vec3(0.0)), vec3(0.72));
        float grain = hash21(gl_FragCoord.xy + time * 23.0 + seed) - 0.5;
        return max(color + grain * 0.026, vec3(0.0));
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / resolution.y;
        gl_FragColor = vec4(effect(uv, time), 1.0);
      }
    `);
  </script>
